<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Utah Cancer Specialists Email Signature Assets</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7f8; color: #163240; }
    main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0 72px; }
    h1 { margin: 0 0 10px; color: #00476b; font-size: clamp(28px, 5vw, 42px); }
    .intro { margin: 0 0 36px; color: #445561; line-height: 1.6; }
    .assets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .asset { overflow: hidden; border: 1px solid #d7e1e5; border-radius: 14px; background: #fff; box-shadow: 0 8px 24px rgba(0, 71, 107, .08); }
    .preview { display: grid; min-height: 190px; place-items: center; padding: 28px; background: #fff; }
    .preview--dark { background: #00476b; }
    .preview img { display: block; width: 100%; max-width: 300px; height: auto; }
    .asset-info { padding: 18px 20px 20px; }
    .asset-name { display: block; margin-bottom: 14px; overflow-wrap: anywhere; font-size: 14px; font-weight: 700; }
    .download { display: inline-block; border-radius: 999px; padding: 10px 16px; background: #00476b; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
    .download:focus-visible { outline: 3px solid #f9c846; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Email signature assets</h1>
    <p class="intro">Approved Utah Cancer Specialists logo files for staff email signatures. Select a file to open or save the original asset.</p>
    <div class="assets">
      <article class="asset">
        <div class="preview"><img src="UCS-logo-black.svg" alt="Utah Cancer Specialists black logo"></div>
        <div class="asset-info"><span class="asset-name">UCS-logo-black.svg</span><a class="download" href="UCS-logo-black.svg">Open file</a></div>
      </article>
      <article class="asset">
        <div class="preview"><img src="UCS-logo-color.svg" alt="Utah Cancer Specialists color logo"></div>
        <div class="asset-info"><span class="asset-name">UCS-logo-color.svg</span><a class="download" href="UCS-logo-color.svg">Open file</a></div>
      </article>
      <article class="asset">
        <div class="preview preview--dark"><img src="UCS-logo-white.svg" alt="Utah Cancer Specialists white logo"></div>
        <div class="asset-info"><span class="asset-name">UCS-logo-white.svg</span><a class="download" href="UCS-logo-white.svg">Open file</a></div>
      </article>
      <article class="asset">
        <div class="preview"><img src="img-89b9f6bd-eba3-4cdd-97ea-29f5582fbec5.jpg" alt="Utah Cancer Specialists email signature logo"></div>
        <div class="asset-info"><span class="asset-name">img-89b9f6bd-eba3-4cdd-97ea-29f5582fbec5.jpg</span><a class="download" href="img-89b9f6bd-eba3-4cdd-97ea-29f5582fbec5.jpg">Open file</a></div>
      </article>
    </div>
  </main>
</body>
</html>
