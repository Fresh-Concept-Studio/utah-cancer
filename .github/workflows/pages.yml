name: Publish Astro to GitHub Pages

# Deliberate manual release. No deployment is triggered by a push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://fresh-concept-studio.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/utah-cancer' }}
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
      SANITY_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install, verify, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run verify

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
